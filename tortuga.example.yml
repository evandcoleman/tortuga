newsletter:
  email:
    # provider: resend          # default; uses RESEND_API_KEY
    provider: mailgun
    mailgun:
      domain: example.com
      region: us
  schedule: "0 9 * * SUN"
  # Set to false to pause automatic scheduled sends (manual preview/API runs still work).
  schedule_enabled: true
  timezone: "America/New_York"
  lookback_days: 7
  from:
    email: "newsletter@example.com"
    name: "Orpheus"
  reply_to: "you@example.com"
  include_libraries:
    - "Movies"
    - "TV Shows"
  filters:
    min_tmdb_rating: 6.0
    dedupe_episodes_into_seasons: true
    max_items_per_section: 12
    exclude_genres: []
  featured:
    enabled: false
  # Optional. When set, digest items render an "Open in Plex" deep link.
  # Find your server's machineIdentifier at https://plex.tv/api/resources?X-Plex-Token=...
  # or in Plex Web → Settings → Network → Show Advanced → Server ID.
  # plex:
  #   server_id: "abc123def4567890abc123def4567890abc12345"
  # Sending Plex invites additionally requires a Plex auth token, set via the
  # PLEX_TOKEN env var (not stored in this file — same pattern as the other
  # provider API keys). See https://evandcoleman.github.io/tortuga/configuration/tortuga-yml.
  # Optional. AI-generated editorial intro paragraph at the top of the digest.
  # Requires ANTHROPIC_API_KEY (provider: anthropic) or OPENAI_API_KEY (provider: openai)
  # in the environment when enabled.
  commentary:
    enabled: false
    provider: anthropic        # anthropic | openai
    model: ""                  # optional; defaults: claude-haiku-4-5 / gpt-4o-mini
    voice: ""                  # optional; freeform tone instructions, e.g.
                               # "witty film-buff concierge, a little irreverent"
  # Optional. Extra links and a freeform block rendered in the digest footer.
  extras:
    request_url: "https://requests.example.com"   # your Overseerr/Ombi/request site
    request_label: "Make a request"
    personal_url: "https://example.com"
    personal_label: "example.com"
    freeform_markdown: |
      Reminder: please don't delete other people's watch history.

# Optional. Public user portal (roadmap #2): a small set of templated pages replacing
# hand-rolled portal sites. Disabled by default; enable and set a
# domain to serve it. See docs/specs/2026-08-31-user-portal.md.
# portal:
#   enabled: true
#   domain: plex.example.com
#   links:
#     plex_url: https://app.plex.tv        # default
#     request_url: https://requests.example.com   # defaults from newsletter.extras.request_url
#     request_label: Overseerr                    # defaults from newsletter.extras.request_label
#     status_url: https://status.example.com       # optional; button hidden if unset
#   pages:
#     getting_started: { enabled: true, markdown: null }
#     rules:           { enabled: true, markdown: null }
#     report_issue:    { enabled: true, markdown: null }
#   # Ordered home-index rows. Omit entirely to use the default six built-ins
#   # (getting_started, rules, plex, request, status, report_issue).
#   entries:
#     - { type: builtin_link, link: plex, label: "Watch now" }   # reorder + relabel a built-in
#     - { type: builtin_page, page: rules, hidden: true }        # keep the page live, hide the row
